<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MANGLE — Colección. Minimal Furniture.">
<title>Colección — MANGLE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f3ee;color:#171717}
a{color:inherit;text-decoration:none}
.header{height:88px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}
.logo{font-weight:700;letter-spacing:.14em}
.back{text-transform:uppercase;font-size:10px;letter-spacing:.18em}
.intro{text-align:center;padding:12vh 20px 9vh}
.kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(48px,7vw,88px);line-height:.92;letter-spacing:-.05em}
.intro p{max-width:460px;margin:24px auto 0;line-height:1.55}
.collection{width:90%;max-width:1280px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:64px 30px;padding-bottom:12vh}
.product{display:block}
.product-image{aspect-ratio:4/3;background:#e9e6df;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.product:hover img{transform:scale(1.02)}
.info{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;gap:20px}
.name{font-weight:600;font-size:18px}
.type{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#666}
.details{margin-top:8px;font-size:12px;color:#666;line-height:1.5}
footer{border-top:1px solid #ddd;padding:30px 5vw;font-size:9px;letter-spacing:.15em;text-transform:uppercase;display:flex;justify-content:space-between}
@media(max-width:700px){
.header{height:76px;padding:0 20px}
.intro{padding:10vh 20px 7vh}
.collection{width:calc(100% - 30px);grid-template-columns:1fr;gap:50px}
.intro p{font-size:15px}
.info{padding-top:14px}
.name{font-size:17px}
.details{font-size:11px}
footer{padding:25px 20px;line-height:2;display:block}
}
</style>
</head>
<body>
<header class="header"><a class="logo" href="index.html">MANGLE</a><a class="back" href="index.html">Volver</a></header>
<main>
<section class="intro"><div class="kicker">MANGLE — Minimal Furniture</div><h1>Colección</h1><p>Objetos esenciales. Proporciones precisas. Una colección concebida para vivir con calma.</p></section>
<section class="collection" id="collection" aria-label="Productos MANGLE">
<article class="product">
<div class="product-image"><img src="CateyV0_00.png" alt="Catey — MANGLE Minimal Furniture" loading="eager"></div>
<div class="info"><div class="name">Catey</div><div class="type">Minimal Furniture</div></div>
<div class="details">50 × 40 × 23.5 cm · Blanco</div>
</article>
</section>
</main>
<footer><span>MANGLE — Minimal Furniture</span><span>© 2026</span></footer>
</body>
</html>
