<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotorra — MANGLE</title><style>body{margin:0;background:#f5f3ee;color:#171717;font-family:Arial,sans-serif}header{padding:28px 5vw;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}main{width:min(1100px,90vw);margin:8vh auto;display:grid;grid-template-columns:1.2fr .8fr;gap:7vw}img{width:100%;display:block}.copy{padding-top:4vh}h1{font-size:clamp(55px,8vw,100px);margin:20px 0;letter-spacing:-.06em}p{font-size:17px;line-height:1.55;max-width:380px}.switch{display:flex;gap:8px;margin-top:35px}.switch button{padding:10px 14px;border:1px solid #aaa;background:transparent;cursor:pointer}.switch button.active{background:#171717;color:#fff}.spec{border-top:1px solid #ccc;margin-top:30px;padding:15px 0;border-bottom:1px solid #ccc}@media(max-width:700px){main{display:block;margin:45px auto}.copy{padding-top:30px}h1{font-size:60px}}</style></head><body><header><strong>MANGLE</strong><a href="coleccion.html">COLECCIÓN</a></header><main><img id="photo" src="CateyV2_00_Blanco.png" alt="Cotorra blanca"><section class="copy"><small>MANGLE — 02</small><h1>Cotorra</h1><p>Mueble auxiliar con gaveta. Una pieza esencial disponible en blanco y negro.</p><div class="switch"><button class="active" data-src="CateyV2_00_Blanco.png">BLANCO</button><button data-src="CateyV2_00.png">NEGRO</button></div><div class="spec">Mueble auxiliar · Blanco / Negro</div></section></main><script>const photo=document.getElementById('photo');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');photo.src=b.dataset.src})</script></body></html>
