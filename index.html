<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANGLE — Minimal Furniture</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 35px 45px;
    }

    .header {
      text-align: center;
    }

    .logo {
      width: 150px;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .content {
      width: 100%;
      max-width: 1200px;
      margin: 60px auto;
      text-align: center;
    }

    .product-image {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto 45px;
    }

    .product-name {
      font-size: clamp(55px, 9vw, 120px);
      font-weight: 300;
      letter-spacing: -5px;
      line-height: 0.9;
      margin-bottom: 25px;
    }

    .description {
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 15px 32px;
      border: 1px solid #1a1a1a;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: #1a1a1a;
      color: #f5f4f0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 25px 20px;
      }

      .logo {
        width: 115px;
      }

      .tagline {
        font-size: 9px;
        letter-spacing: 3px;
      }

      .content {
        margin: 40px auto;
      }

      .footer {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <header class="header">

      <img
        class="logo"
        src="Logo%20minimalista%20de%20Mangle%20Furniture.png"
        alt="MANGLE Minimal Furniture"
      >

      <div class="tagline">
        Minimal Furniture
      </div>

    </header>

    <section class="content">

      <img
        class="product-image"
        src="ChatGPT%20Image%209%20ago%202026%2012_47_06.png"
        alt="Catey — MANGLE Minimal Furniture"
      >

      <h1 class="product-name">CATEY</h1>

      <p class="description">
        Minimalismo que ocupa poco espacio.
      </p>

      <a href="#" class="button">
        Ver colección
      </a>

    </section>

    <footer class="footer">
      <span>Cancún, México</span>
      <span>© MANGLE</span>
    </footer>

  </main>

</body>
</html>
