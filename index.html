<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANGLE — Minimal Furniture</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 30px 45px 35px;
    }

    .header {
      text-align: center;
    }

    .logo {
      width: 150px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .content {
      width: 100%;
      max-width: 1200px;
      margin: 35px auto 60px;
      text-align: center;
    }

    .product-image {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto 45px;
    }

    .product-name {
      font-size: clamp(55px, 9vw, 120px);
      font-weight: 300;
      letter-spacing: -5px;
      line-height: 0.9;
      margin-bottom: 25px;
    }

    .description {
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 15px 32px;
      border: 1px solid #1a1a1a;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: #1a1a1a;
      color: #f5f4f0;
    }

    /* COLECCIÓN */

    .collection {
      padding: 110px 45px 100px;
      border-top: 1px solid #deddd8;
      text-align: center;
    }

    .collection-title {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 70px;
    }

    .collection-product {
      max-width: 1000px;
      margin: 0 auto;
    }

    .collection-image {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      margin: 0 auto 40px;
    }

    .collection-name {
      font-size: clamp(50px, 8vw, 100px);
      font-weight: 300;
      letter-spacing: -4px;
      margin-bottom: 20px;
    }

    .collection-description {
      font-size: 15px;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .collection-button {
      display: inline-block;
      padding: 14px 30px;
      border: 1px solid #1a1a1a;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* GALERÍA */

    .gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 45px;
    }

    .gallery img {
      width: 120px;
      height: 90px;
      object-fit: cover;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      padding: 0 45px 30px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {

      .hero {
        padding: 20px 18px 25px;
      }

      .logo {
        width: 155px;
      }

      .content {
        margin: 25px auto 45px;
      }

      .product-image {
        width: 100%;
        margin-bottom: 35px;
      }

      .product-name {
        font-size: 72px;
        letter-spacing: -4px;
        margin-bottom: 20px;
      }

      .description {
        font-size: 15px;
        margin-bottom: 28px;
      }

      .button {
        padding: 15px 28px;
      }

      .collection {
        padding: 80px 18px 75px;
      }

      .collection-title {
        font-size: 12px;
        letter-spacing: 4px;
        margin-bottom: 45px;
      }

      .collection-image {
        margin-bottom: 30px;
      }

      .collection-name {
        font-size: 65px;
      }

      .collection-description {
        font-size: 14px;
        line-height: 1.6;
      }

      .gallery {
        gap: 8px;
        margin-top: 35px;
      }

      .gallery img {
        width: 30%;
        height: 75px;
      }

      .footer {
        padding: 0 18px 25px;
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- PORTADA -->

  <main class="hero">

    <header class="header">

      <img
        class="logo"
        src="logo-mangle.png"
        alt="MANGLE Minimal Furniture"
      >

    </header>

    <section class="content">

      <img
        class="product-image"
        src="ChatGPT%20Image%209%20ago%202026%2012_47_06.png"
        alt="Catey — MANGLE Minimal Furniture"
      >

      <h1 class="product-name">CATEY</h1>

      <p class="description">
        Minimalismo que ocupa poco espacio.
      </p>

      <a href="#coleccion" class="button">
        Ver colección
      </a>

    </section>

  </main>


  <!-- COLECCIÓN -->

  <section class="collection" id="coleccion">

    <h2 class="collection-title">
      Colección
    </h2>

    <div class="collection-product">

      <img
        class="collection-image"
        src="ChatGPT%20Image%209%20ago%202026%2012_47_06.png"
        alt="Catey — MANGLE"
      >

      <h2 class="collection-name">
        CATEY
      </h2>

      <p class="collection-description">
        Un mueble pensado para aprovechar cada espacio.
      </p>

      <a href="#" class="collection-button">
        Ver producto
      </a>

      <div class="gallery">

        <img
          src="ChatGPT%20Image%209%20ago%202026%2012_47_06.png"
          alt="Catey vista principal"
        >

        <img
          src="ChatGPT%20Image%209%20ago%202026%2012_47_06.png"
          alt="Catey vista adicional"
        >

        <img
          src="ChatGPT%20Image%209%20ago%202026%2012_47_06.png"
          alt="Catey otra vista"
        >

      </div>

    </div>

  </section>


  <!-- PIE -->

  <footer class="footer">

    <span>Cancún, México</span>

    <span>© MANGLE</span>

  </footer>

</body>
</html>
