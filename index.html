<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANGLE — Minimal Furniture</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      width: 100%;
      background: #f5f4f0;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =========================
       HERO TEXTO
    ========================= */

    .hero-content {
      text-align: center;
      padding: 75px 25px 100px;
    }

    .hero-title {
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 300;
      letter-spacing: 7px;
      line-height: 1.15;
      margin-bottom: 35px;
    }

    .hero-link {
      display: inline-block;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid #1a1a1a;
      transition: opacity 0.3s ease;
    }

    .hero-link:hover {
      opacity: 0.55;
    }


    /* =========================
       NUESTRA IDEA
    ========================= */

    .idea {
      padding: 115px 25px 120px;
      text-align: center;
      border-top: 1px solid #deddd8;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 35px;
      font-weight: 400;
    }

    .section-line {
      width: 35px;
      height: 1px;
      background: #1a1a1a;
      margin: 0 auto 35px;
    }

    .idea-text {
      max-width: 700px;
      margin: 0 auto;

      font-size: clamp(24px, 4vw, 42px);

      font-weight: 300;

      line-height: 1.45;

      letter-spacing: 1px;
    }


    /* =========================
       COLECCIÓN
    ========================= */

    .collection {
      padding: 100px 45px 120px;
      border-top: 1px solid #deddd8;
      text-align: center;
    }

    .collection-title {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 70px;
    }

    .collection-product {
      max-width: 1100px;
      margin: 0 auto;

      display: grid;

      grid-template-columns:
        minmax(0, 1.7fr)
        minmax(280px, 0.8fr);

      align-items: center;

      gap: 70px;

      text-align: left;
    }


    /* FOTO CATEY */

    .collection-image {
      display: block;

      width: 100%;

      height: auto;

      margin: 0;
    }


    /* INFORMACIÓN CATEY */

    .collection-info {
      padding: 20px 0;
    }

    .collection-name {
      font-size: clamp(50px, 7vw, 90px);

      font-weight: 300;

      letter-spacing: -4px;

      line-height: 0.9;

      margin-bottom: 25px;
    }

    .collection-description {
      font-size: 16px;

      line-height: 1.7;

      letter-spacing: 0.5px;

      max-width: 330px;

      margin-bottom: 30px;
    }

    .collection-price {
      font-size: 24px;

      letter-spacing: 1px;

      margin-bottom: 35px;
    }

    .collection-button {
      display: inline-block;

      padding: 15px 30px;

      border: 1px solid #1a1a1a;

      color: #1a1a1a;

      text-decoration: none;

      font-size: 11px;

      letter-spacing: 3px;

      text-transform: uppercase;

      transition: all 0.3s ease;
    }

    .collection-button:hover {
      background: #1a1a1a;

      color: #f5f4f0;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      display: flex;

      justify-content: space-between;

      padding: 25px 45px 30px;

      border-top: 1px solid #deddd8;

      font-size: 10px;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.6;
    }


    /* =========================
       MÓVIL
    ========================= */

    @media (max-width: 700px) {

      .hero-image {
        width: 100%;
        height: auto;
      }


      .hero-content {
        padding:
          60px
          20px
          80px;
      }


      .hero-title {
        font-size: 30px;

        letter-spacing: 5px;

        line-height: 1.4;

        margin-bottom: 30px;
      }


      .idea {
        padding:
          85px
          20px
          90px;
      }


      .section-label {
        font-size: 10px;

        letter-spacing: 4px;

        margin-bottom: 28px;
      }


      .section-line {
        margin-bottom: 28px;
      }


      .idea-text {
        font-size: 25px;

        line-height: 1.5;
      }


      .collection {
        padding:
          80px
          18px
          90px;
      }


      .collection-title {
        font-size: 11px;

        letter-spacing: 4px;

        margin-bottom: 45px;
      }


      .collection-product {

        display: flex;

        flex-direction: column;

        gap: 40px;

        text-align: center;
      }


      .collection-image {
        width: 100%;
      }


      .collection-info {
        padding: 0;
      }


      .collection-name {
        font-size: 68px;

        letter-spacing: -4px;

        margin-bottom: 20px;
      }


      .collection-description {
        margin:
          0 auto
          25px;

        font-size: 15px;
      }


      .collection-price {
        font-size: 23px;

        margin-bottom: 30px;
      }


      .collection-button {
        padding:
          15px
          28px;
      }


      .footer {
        padding:
          25px
          18px
          30px;

        flex-direction: column;

        gap: 10px;

        text-align: center;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <img
      class="hero-image"
      src="hero-mangle.png"
      alt="MANGLE Minimal Furniture"
    >

  </section>



  <!-- =========================
       MENSAJE PRINCIPAL
  ========================= -->

  <section class="hero-content">

    <h1 class="hero-title">
      LESS FURNITURE.<br>
      MORE SPACE.
    </h1>

    <a
      href="#coleccion"
      class="hero-link"
    >
      Ver colección
    </a>

  </section>



  <!-- =========================
       NUESTRA IDEA
  ========================= -->

  <section class="idea">

    <h2 class="section-label">
      Nuestra idea
    </h2>

    <div class="section-line"></div>

    <p class="idea-text">
      Diseñamos piezas esenciales,
      funcionales y honestas.
      Para espacios que respiran.
    </p>

  </section>



  <!-- =========================
       COLECCIÓN
  ========================= -->

  <section
    class="collection"
    id="coleccion"
  >

    <h2 class="collection-title">
      Colección
    </h2>


    <div class="collection-product">


      <!-- FOTO CATEY -->

      <img
        class="collection-image"
        src="CateyV0_00.png"
        alt="Catey — MANGLE"
      >


      <!-- INFORMACIÓN -->

      <div class="collection-info">

        <h3 class="collection-name">
          CATEY
        </h3>

        <p class="collection-description">
          Minimalismo que ocupa poco espacio.
        </p>

        <div class="collection-price">
          $599 MXN
        </div>

        <a
          href="producto.html?producto=catey"
          class="collection-button"
        >
          Ver producto
        </a>

      </div>

    </div>

  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="footer">

    <span>
      Cancún, México
    </span>

    <span>
      © MANGLE
    </span>

  </footer>


</body>
</html>
